<style>
  :root{
    --bg:#0a0c0f;
    --bg-grid: rgba(255,255,255,.035);
    --panel:#12151b;
    --panel-2:#171b22;
    --panel-tr: rgba(10,12,15,.72);
    --border: rgba(255,255,255,.09);
    --border-strong: rgba(255,255,255,.18);
    --text:#edeff2;
    --text-dim:#9aa1ac;
    --text-faint:#5b6170;
    --accent:#ff6b35;
    --accent-soft: rgba(255,107,53,.14);
    --accent-2:#3fd9c7;
    --accent-2-soft: rgba(63,217,199,.14);
    --radius-sm:8px;
    --radius:14px;
    --radius-lg:20px;
    --shadow: 0 24px 60px -28px rgba(0,0,0,.65);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  [data-theme="light"]{
    --bg:#eef0f3;
    --bg-grid: rgba(10,12,15,.05);
    --panel:#ffffff;
    --panel-2:#f6f7f9;
    --panel-tr: rgba(255,255,255,.78);
    --border: rgba(10,12,15,.09);
    --border-strong: rgba(10,12,15,.18);
    --text:#14171c;
    --text-dim:#565c68;
    --text-faint:#8a8f99;
    --accent:#e85a2a;
    --accent-soft: rgba(232,90,42,.10);
    --accent-2:#0f8f81;
    --accent-2-soft: rgba(15,143,129,.10);
    --shadow: 0 24px 60px -28px rgba(20,23,28,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size:44px 44px;
    color:var(--text);
    font-family:var(--font-body);
    letter-spacing:-.01em;
    min-height:100vh;
    transition: background-color .3s ease, color .3s ease;
  }
  img{display:block; max-width:100%;}
  button, select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:#0a0c0f;}
  *:focus-visible{outline:2px solid var(--accent-2); outline-offset:3px; border-radius:4px;}

  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ---------- Topbar ---------- */
  .topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); background:var(--panel-tr); border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-avatar{width:36px; height:36px; border-radius:10px; object-fit:cover; border:1px solid var(--border-strong);}
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.02em;}
  .brand-mark{color:var(--accent); font-size:11px; margin-left:2px;}
  .topbar-controls{display:flex; align-items:center; gap:10px;}
  .control-select, .control-btn{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:999px; padding:9px 14px; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .control-select:hover, .control-btn:hover{border-color:var(--border-strong);}

  /* ---------- Hero ---------- */
  .hero{padding:64px 0 0;}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:56px; flex-wrap:wrap;}
  .hero-main{flex:1; min-width:280px;}
  .status-chip{display:inline-flex; align-items:center; gap:9px; padding:7px 14px 7px 12px; border-radius:999px; border:1px solid var(--accent-soft); background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; margin-bottom:22px;}
  .status-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
  .hero-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.16em; color:var(--text-faint); margin-bottom:10px;}
  .hero-title{font-family:var(--font-display); font-weight:600; font-size:clamp(2.1rem, 4.6vw, 3.4rem); line-height:1.05; letter-spacing:-.03em; margin-bottom:16px;}
  .hero-subtitle{color:var(--text-dim); font-size:17px; line-height:1.55; max-width:46ch; margin-bottom:28px;}
  .meta-row{display:flex; flex-wrap:wrap; gap:10px;}
  .meta-tag{display:flex; align-items:center; gap:9px; padding:9px 16px; border:1px solid var(--border); border-radius:999px; font-size:13px; background:var(--panel);}
  .meta-label{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:.1em;}

  .hero-contact{width:280px; padding:24px; flex-shrink:0;}
  .hero-contact-label{font-size:13px; color:var(--text-dim); margin-bottom:12px;}
  .discord-copy{display:inline-flex; align-items:center; gap:10px; width:100%; justify-content:space-between; padding:12px 16px; border-radius:12px; border:1px solid var(--border-strong); background:var(--panel-2); font-family:var(--font-mono); font-size:14px; color:var(--text); cursor:pointer;}
  .discord-copy:hover{border-color:var(--accent-2); color:var(--accent-2);}
  .discord-copy .copy-icon{font-size:14px; opacity:.7;}
  .hero-contact-note{font-size:12.5px; line-height:1.55; color:var(--text-faint); margin-top:14px;}

  .frame-ruler{position:relative; margin-top:52px; padding-top:20px; border-top:1px solid var(--border);}
  .ruler-track{display:flex; justify-content:space-between; align-items:flex-start;}
  .tick{width:1px; height:7px; background:var(--border-strong);}
  .tick--major{height:13px; background:var(--text-faint); position:relative;}
  .tick--major i{position:absolute; top:17px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-style:normal; font-size:10px; color:var(--text-faint); white-space:nowrap;}
  .playhead{position:absolute; top:-1px; left:0; width:2px; height:13px; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:scrub 10s linear infinite;}
  @keyframes scrub{0%{left:0%;} 100%{left:100%;}}
  @media (prefers-reduced-motion: reduce){ .playhead{animation:none; left:14%;} .status-chip .dot{animation:none;} }

  /* ---------- Scenes ---------- */
  .scene{padding:76px 0;}
  .scene-head{display:flex; align-items:baseline; gap:22px; margin-bottom:32px;}
  .scene-head-left{display:flex; align-items:baseline; gap:14px; white-space:nowrap;}
  .scene-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; color:var(--accent);}
  .scene-head h2{font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:-.02em;}
  .scene-rule{flex:1; height:1px; background:var(--border-strong); align-self:center;}
  .scene-note{color:var(--text-dim); font-size:15px; margin:-16px 0 28px;}

  .scene-grid{display:grid; gap:24px;}
  .two-col{grid-template-columns:1fr 1fr;}
  @media (max-width:780px){ .two-col{grid-template-columns:1fr;} .hero-top{gap:32px;} .hero-contact{width:100%;} }

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px;}
  .panel h2{font-family:var(--font-display); font-weight:600; font-size:20px; margin-bottom:18px;}
  .panel p{color:var(--text-dim); line-height:1.65; font-size:15px;}
  .panel p + p{margin-top:14px;}

  .marked-list{list-style:none;}
  .marked-list li{display:flex; gap:12px; color:var(--text-dim); font-size:15px; line-height:1.6;}
  .marked-list li::before{content:'◆'; color:var(--accent-2); font-size:9px; flex-shrink:0; margin-top:7px;}
  .marked-list li + li{margin-top:12px;}

  .pill-row{display:flex; flex-wrap:wrap; gap:9px; margin-top:24px;}
  .pill{font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:999px; background:var(--accent-2-soft); color:var(--accent-2); border:1px solid transparent;}

  /* ---------- Pricing ---------- */
  .pricing-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .pricing-panel-head h3{font-family:var(--font-display); font-weight:600; font-size:19px;}
  .pricing-tag{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--accent-2); background:var(--accent-2-soft); padding:5px 10px; border-radius:6px;}
  .track-row{display:flex; align-items:baseline; gap:10px; padding:13px 0; border-bottom:1px solid var(--border);}
  .track-row:last-child{border-bottom:none;}
  .track-diamond{color:var(--accent-2); font-size:9px; flex-shrink:0;}
  .track-type{color:var(--text-dim); font-size:14.5px;}
  .track-leader{flex:1; border-bottom:1px dotted var(--border-strong); transform:translateY(-4px);}
  .track-price{font-family:var(--font-mono); font-weight:600; font-size:14.5px; white-space:nowrap;}

  /* ---------- Workflow ---------- */
  .step-row{display:flex; gap:18px; padding:18px 0; border-bottom:1px solid var(--border);}
  .step-row:last-child{border-bottom:none;}
  .step-frame{font-family:var(--font-mono); font-size:12.5px; color:var(--accent); flex-shrink:0; padding-top:2px; width:52px;}
  .step-text{color:var(--text-dim); line-height:1.6; font-size:15px;}

  /* ---------- Showcase ---------- */
  .showcase-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:22px;}
  @media (max-width:900px){ .showcase-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .showcase-grid{grid-template-columns:1fr;} }
  .shot-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; transition:border-color .25s ease, transform .25s ease;}
  .shot-card:hover{border-color:var(--accent-2); transform:translateY(-4px);}
  .shot-frame{position:relative; aspect-ratio:16/9; background:#000;}
  .shot-tag, .shot-category{position:absolute; top:10px; z-index:2; font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; padding:4px 8px; border-radius:5px;}
  .shot-tag{left:10px; background:rgba(0,0,0,.65); color:#fff;}
  .shot-category{right:10px; background:var(--accent-2); color:#04211c; font-weight:600;}
  .shot-embed iframe{width:100%; height:100%; border:0; display:block;}
  .shot-info{padding:18px 20px;}
  .shot-info h3{font-family:var(--font-display); font-weight:600; font-size:16.5px; margin-bottom:6px;}
  .shot-info p{color:var(--text-dim); font-size:13.5px; line-height:1.55;}

  /* ---------- Footer ---------- */
  .site-footer{padding:36px 0 56px; text-align:center; color:var(--text-faint); font-size:13px;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(6,7,9,.82); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;}
  .modal-overlay.hidden{display:none;}
  .modal-panel{background:var(--panel); border:1px solid var(--border-strong); border-radius:var(--radius-lg); max-width:400px; width:100%; padding:40px 34px; text-align:center; box-shadow:var(--shadow);}
  .modal-mark{color:var(--accent); font-size:16px; margin-bottom:14px;}
  .modal-panel h2{font-family:var(--font-display); font-weight:600; font-size:24px; margin-bottom:8px;}
  .modal-panel > p{color:var(--text-dim); font-size:14.5px; margin-bottom:26px;}
  .modal-choices{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .lang-choice{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px 12px; font-size:15px; font-weight:500; cursor:pointer; color:var(--text);}
  .lang-choice:hover{border-color:var(--accent-2); transform:translateY(-2px);}
  .modal-skip{margin-top:22px; background:none; border:none; color:var(--text-faint); font-size:13px; cursor:pointer;}
  .modal-skip:hover{color:var(--text-dim);}

  /* ---------- Toast ---------- */
  .toast{position:fixed; bottom:26px; left:50%; transform:translate(-50%,16px); background:var(--panel); border:1px solid var(--border-strong); padding:12px 22px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:all .28s cubic-bezier(.4,0,.22,1); z-index:9999;}
  .toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>

let toastTimer = null;

// ==================== RENDER ====================
function renderAll(lang){
  const d = siteData[lang];
  document.documentElement.lang = lang;

  document.getElementById('modal-title').textContent = d.modal.title;
  document.getElementById('modal-subtitle').textContent = d.modal.subtitle;
  document.getElementById('modal-skip').textContent = d.modal.skip;
  document.getElementById('badge-commissions').textContent = d.badge;

  document.getElementById('hero-eyebrow').textContent = d.hero.eyebrow;
  document.getElementById('hero-title').textContent = d.hero.title;
  document.getElementById('hero-subtitle').textContent = d.hero.subtitle;
  document.getElementById('meta-experience').textContent = d.meta.experience;
  document.getElementById('meta-payments').textContent = d.meta.payments;
  document.getElementById('contact-discord-label').textContent = d.contact.discordLabel;
  document.getElementById('contact-include').textContent = d.contact.include;

  document.getElementById('scene-about-title').textContent = d.sceneTitles.about;
  document.getElementById('pricing-title').textContent = d.sceneTitles.pricing;
  document.getElementById('contact-title').textContent = d.sceneTitles.contact;
  document.getElementById('showcase-title').textContent = d.sceneTitles.showcase;
  document.getElementById('terms-title').textContent = d.sceneTitles.terms;
  document.getElementById('pricing-note').textContent = d.pricing.note;

  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  document.getElementById('theme-text').textContent = isDark ? d.theme.dark : d.theme.light;

  renderAbout(d);
  renderWhatYouGet(d);
  renderPricing(d);
  renderWorkflow(d);
  renderShowcase(d);
  renderTerms(d);
}

function renderAbout(d){
  document.getElementById('about-card').innerHTML = `
    <h2>${d.about.title}</h2>
    <p>${d.about.text1}</p>
    <p>${d.about.text2}</p>`;
}

function renderWhatYouGet(d){
  const items = d.whatYouGet.items.map(i => `<li>${i}</li>`).join('');
  const pills = d.whatYouGet.pills.map(p => `<span class="pill">${p}</span>`).join('');
  document.getElementById('what-card').innerHTML = `
    <h2>${d.whatYouGet.title}</h2>
    <ul class="marked-list">${items}</ul>
    <div class="pill-row">${pills}</div>`;
}

function pricingPanel(block){
  const rows = block.rows.map(r => `
    <div class="track-row">
      <span class="track-diamond">◆</span>
      <span class="track-type">${r.type}</span>
      <span class="track-leader"></span>
      <span class="track-price">${r.price}</span>
    </div>`).join('');
  return `
    <div class="panel">
      <div class="pricing-panel-head">
        <h3>${block.title}</h3>
        <span class="pricing-tag">${block.tag}</span>
      </div>
      ${rows}
    </div>`;
}

function renderPricing(d){
  document.getElementById('pricing-grid').innerHTML =
    pricingPanel(d.pricing.usd) + pricingPanel(d.pricing.robux);
}

function renderWorkflow(d){
  document.getElementById('contact-list').innerHTML = d.workflow.map((step, i) => `
    <div class="step-row">
      <span class="step-frame">F${String(i + 1).padStart(3, '0')}</span>
      <span class="step-text">${step}</span>
    </div>`).join('');
}

function renderShowcase(d){
  document.getElementById('video-grid').innerHTML = d.showcase.videos.map((v, i) => `
    <article class="shot-card">
      <div class="shot-frame">
        <span class="shot-tag">F${String(i + 1).padStart(4, '0')}</span>
        <span class="shot-category">${v.tag}</span>
        <div class="shot-embed">
          <iframe src="https://www.youtube.com/embed/${v.youtubeId}" title="${v.title}" loading="lazy" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
      <div class="shot-info">
        <h3>${v.title}</h3>
        <p>${v.desc}</p>
      </div>
    </article>`).join('');
}

function renderTerms(d){
  document.getElementById('terms-list').innerHTML = d.terms.map(t => `<li>${t}</li>`).join('');
}

function buildRuler(){
  const track = document.getElementById('ruler-track');
  const total = 40;
  let html = '';
  for (let i = 0; i <= total; i++){
    const major = i % 5 === 0;
    html += major
      ? `<span class="tick tick--major"><i>${String(i * 6).padStart(4, '0')}</i></span>`
      : `<span class="tick"></span>`;
  }
  track.innerHTML = html;
}

// ==================== LANGUAGE / THEME ====================
function setLanguage(lang){
  if (!siteData[lang]) return;
  renderAll(lang);
  document.getElementById('language-dropdown').value = lang;
  closeModal();
  localStorage.setItem('preferredLang', lang);
}

function closeModal(){
  document.getElementById('language-modal').classList.add('hidden');
}

function toggleTheme(){
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('theme-icon').textContent = isLight ? '☀️' : '🌙';
  const lang = localStorage.getItem('preferredLang') || 'en';
  document.getElementById('theme-text').textContent = isLight ? siteData[lang].theme.light : siteData[lang].theme.dark;
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  buildRuler();

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('theme-icon').textContent = '🌙';
  } else {
    document.getElementById('theme-icon').textContent = '☀️';
  }

  const savedLang = localStorage.getItem('preferredLang') || 'en';
  document.getElementById('language-dropdown').value = savedLang;
  renderAll(savedLang);

  if (!localStorage.getItem('preferredLang')){
    document.getElementById('language-modal').classList.remove('hidden');
  }

  document.getElementById('discord-copy-btn').addEventListener('click', async () => {
    const lang = localStorage.getItem('preferredLang') || 'en';
    try {
      await navigator.clipboard.writeText('nerditadori');
    } catch (err) {
      /* clipboard unavailable — still show confirmation since the handle is visible on the button */
    }
    showToast(siteData[lang].toast.copied);
  });

  console.log('%c◆ Nerd Itadori — Animation Commissions loaded', 'color:#ff6b35; font-weight:bold');
});
</script>
